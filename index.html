<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味测评</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: system-ui, sans-serif;
        }
body {
background: #f7f8fa;
padding: 20px;
        }
.container {
max-width: 600px;
margin: 0 auto;
background: #fff;
border-radius: 16px;
padding: 24px;
box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
.title {
text-align: center;
font-size: 22px;
margin-bottom: 20px;
color: #333;
        }
.question-box {
margin-bottom: 24px;
        }
.question {
font-size: 18px;
margin-bottom:12px;
        }
.option-item {
padding:12px 16px;
border:1px solid #e5e7eb;
border-radius:10px;
margin-bottom:10px;
cursor: pointer;
transition: all 0.2s;
        }
.option-item:hover {
border-color: #6366f1;
background: #f5f6ff;
        }
.option-item.active {
background: #6366f1;
color:#fff;
border-color:#6366f1;
        }
.btn-next {
width:100%;
padding:14px;
border:none;
background:#6366f1;
color:white;
border-radius:12px;
font-size:16px;
cursor: pointer;
        }
.result-wrap {
display:none;
        }
/* 卡密弹窗 */
.password-modal {
position: fixed;
inset:0;
background:rgba(0,0,0,0.7);
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
        }
.modal-box {
background:white;
padding:30px;
border-radius:16px;
width:90%;
max-width:400px;
        }
.modal-box h3 {
margin-bottom:16px;
text-align:center;
        }
#pwdInput {
width:100%;
padding:12px 14px;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;
margin-bottom:14px;
        }
.submit-pwd {
width:100%;
padding:12px;
background:#6366f1;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
        }
.tip-text {
color:red;
font-size:14px;
text-align:center;
margin-top:8px;
display:none;
        }
</style>
</head>
<!-- 删掉了 oncontextmenu="return false;" 解除右键锁定 -->
<body>
<!-- 卡密弹窗 -->
<div class="password-modal" id="pwdModal">
<div class="modal-box">
<h3>请输入访问卡密</h3>
<input type="password" id="pwdInput" placeholder="请输入卡密">
<button class="submit-pwd" onclick="checkPassword()">确认进入</button>
<div class="tip-text" id="errorTip">卡密错误，请重新输入</div>
</div>
</div>


<!-- 测评主体 -->
<div class="container" id="quizWrap" style="display:none;">
<div class="title">趣味测评问卷</div>
<div class="question-box">
<div class="question" id="questionText"></div>
<div id="optionList"></div>
</div>
<button class="btn-next" id="nextBtn" onclick="nextQuestion()">下一题</button>


<div class="result-wrap" id="resultBox">
<div class="title">你的测试结果</div>
<div id="resultContent"></div>
<div style="margin-top:20px;font-size:12px;color:#888;">免责声明：本测评仅为趣味娱乐，不具备专业诊断效力，仅供参考</div>
</div>
</div>


<script>
// 对接你刚刚部署好的Cloudflare Workers接口
const API_URL = "https://quiz-auth.1226164210.workers.dev/";


// ===== 这里填写你的测评题目，后续在这里修改题库 =====
const questionList = [
    {
        title:"第一题：休息时你更喜欢？",
        options:[
            {text:"A 宅家独处",score:1},
            {text:"B 出门聚会",score:2}
        ]
    },
    {
        title:"第二题：做决定通常？",
        options:[
            {text:"A 谨慎思考很久",score:1},
            {text:"B 凭直觉快速选择",score:2}
        ]
    }
]


// ===== 根据总分返回测评结果 =====
function getResult(totalScore){
if(totalScore <=2){
return "【类型A】内敛深思型：做事稳重，擅长独立思考，享受安静的个人空间。"
    }else{
return "【类型B】外向活力型：乐于社交，行动力强，愿意尝试新鲜事物。"
    }
}


// 请求后端校验卡密
async function checkPassword(){
const inputVal = document.getElementById("pwdInput").value.trim();
const tipDom = document.getElementById("errorTip");
    tipDom.style.display = "none";


const res = await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({pwd:inputVal})
    })
const data = await res.json();
if(data.ok){
        document.getElementById("pwdModal").style.display = "none";
        document.getElementById("quizWrap").style.display = "block";
        initQuiz();
    }else{
        tipDom.innerText = data.msg;
        tipDom.style.display = "block";
    }
}


// 测评逻辑
let currentIndex = 0;
let totalScore = 0;


function initQuiz(){
    renderQuestion();
}
function renderQuestion(){
const item = questionList[currentIndex];
    document.getElementById("questionText").innerText = item.title;
const optWrap = document.getElementById("optionList");
    optWrap.innerHTML = "";
    item.options.forEach((opt,idx)=>{
const div = document.createElement("div");
        div.className = "option-item";
        div.innerText = opt.text;
        div.onclick = ()=>{
            document.querySelectorAll(".option-item").forEach(d=>d.classList.remove("active"))
            div.classList.add("active");
            totalScore += opt.score;
        }
        optWrap.appendChild(div);
    })
}
function nextQuestion(){
    currentIndex++;
if(currentIndex >= questionList.length){
// 全部题目完成，展示结果
        document.querySelector(".question-box").style.display = "none";
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("resultBox").style.display = "block";
        document.getElementById("resultContent").innerText = getResult(totalScore);
return;
    }
    renderQuestion();
}
</script>
</body>
</html>
