<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史人物性格测评</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
body {
padding:24px 16px;
background-color: #f8f3e9;
min-height:100vh;
}
.wrap {
max-width:860px;
margin:0 auto;
}

/* 顶部进度模块 */
.progress-wrap{
background:#fffbf5;
border-radius:16px;
padding:20px 24px;
box-shadow: 0 2px 10px rgba(139,115,85,0.08);
margin-bottom:20px;
}
.progress-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
color:#77644e;
font-size:14px;
}
.progress-bar-bg{
width:100%;
height:10px;
background:#e8e2d8;
border-radius:99px;
overflow:hidden;
}
.progress-bar-fill{
height:100%;
background:#b8996e;
border-radius:99px;
transition:0.35s ease;
width:0%;
}

/* 题目卡片 */
.question-card{
background:#fffbf5;
border-radius:24px;
padding:40px 36px;
box-shadow: 0 4px 18px rgba(139,115,85,0.07);
}
.card-tag{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:28px;
}
.tag-left{
font-size:14px;
color:#8c7860;
letter-spacing:1px;
}
.tag-right{
border:1px solid #ddcdb8;
border-radius:12px;
padding:4px 12px;
font-size:13px;
color:#8c7860;
}
.q-title{
font-size:28px;
line-height:1.6;
color:#332b20;
margin-bottom:36px;
font-weight:500;
}

/* A/B/C/D选项 */
.option-list{
display:flex;
flex-direction:column;
gap:16px;
}
.opt-item{
display:flex;
align-items:center;
gap:16px;
border:1px solid #e2d9cc;
border-radius:20px;
padding:20px 22px;
cursor:pointer;
background:#ffffff;
transition:0.24s;
}
.opt-item:hover{
background:#fff8ec;
border-color:#d4c3ad;
}
.opt-item.active{
background:#fff2df;
border-color:#c9b394;
}
.opt-letter{
width:40px;
height:40px;
border-radius:50%;
background:#f3e9da;
display:flex;
align-items:center;
justify-content:center;
color:#705c44;
font-weight:500;
flex-shrink:0;
}
.opt-text{
font-size:17px;
color:#443b2f;
line-height:1.6;
}

/* 底部导航区域 */
.bottom-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:40px;
}
.btn-prev{
border:1px solid #c9b9a3;
background:#fffbf5;
color:#6b5a46;
border-radius:12px;
padding:12px 24px;
font-size:16px;
cursor:pointer;
}
.btn-prev:disabled{
opacity:0.32;
cursor:not-allowed;
}
.btn-next{
border:none;
background:#b8996e;
color:#fff;
border-radius:12px;
padding:12px 32px;
font-size:16px;
cursor:pointer;
}
.btn-submit{
border:none;
background:#997c54;
color:#fff;
border-radius:12px;
padding:12px 32px;
font-size:16px;
cursor:pointer;
display:none;
}
.btn-reset{
border:none;
background:#c2a885;
color:#fff;
border-radius:12px;
padding:12px 24px;
font-size:16px;
cursor:pointer;
margin-top:24px;
}
.bottom-tip{
font-size:14px;
color:#8c7860;
}

/* 结果页 */
.page{display:none;}
.page.active{display:block;}
.result-card{
background:#fffbf5;
border-radius:24px;
padding:40px 36px;
box-shadow: 0 4px 18px rgba(139,115,85,0.07);
}
.result-block {
margin-top:20px;
line-height:1.75;
color:#443b2f;
}
.result-block h3 {
margin:16px 0 8px;
color:#6b5a46;
}
ul{
padding-left:22px;
}
</style>
</head>
<body>
<div class="wrap">
    <!--答题页-->
    <div id="quizPage" class="page active">
        <!--进度条-->
        <div class="progress-wrap">
            <div class="progress-header">
                <span>档案进度</span>
                <span id="progressNum">1 / 24</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progressFill" class="progress-bar-fill"></div>
            </div>
        </div>

        <!--题目卡片-->
        <div class="question-card">
            <div class="card-tag">
                <div class="tag-left">今日脑洞</div>
                <div class="tag-right">SCENE CARD</div>
            </div>
            <div class="q-title" id="qTitle"></div>
            <div class="option-list" id="optionBox"></div>

            <div class="bottom-bar">
                <button class="btn-prev" id="prevBtn">上一题</button>
                <div class="bottom-tip">每题只需选一个最贴近你的反应。</div>
                <button class="btn-next" id="nextBtn">下一题</button>
                <button class="btn-submit" id="submitBtn">提交测评</button>
            </div>
        </div>
    </div>

    <!--结果页-->
    <div id="resultPage" class="page">
        <div class="result-card">
            <h2>你的匹配人物：<span id="resName"></span></h2>
            <div class="result-block">
                <h3>人物解读</h3>
                <p id="resPortrait"></p>
            </div>
            <div class="result-block">
                <h3>核心优势</h3>
                <ul id="resAbility"></ul>
            </div>
            <div class="result-block">
                <h3>现实表现</h3>
                <p id="resRealShow"></p>
            </div>
            <div class="result-block">
                <h3>潜在风险</h3>
                <p id="resRisk"></p>
            </div>
            <div class="result-block">
                <h3>改善建议</h3>
                <p id="resSuggest"></p>
            </div>
            <div class="result-block">
                <h3>相似人物</h3>
                <p id="resSimilar"></p>
            </div>
            <button class="btn-reset" id="resetBtn">重新答题</button>
        </div>
    </div>
</div>

<script type="module">
import { questionList } from './questionList.js'
import { characterList } from './characterList.js'
import { calcCosSimilarity, getUserVector, matchPerson } from './utils.js'

const quizPage = document.getElementById("quizPage");
const resultPage = document.getElementById("resultPage");
const qTitle = document.getElementById("qTitle");
const optionBox = document.getElementById("optionBox");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
const resetBtn = document.getElementById("resetBtn");
const progressNum = document.getElementById("progressNum");
const progressFill = document.getElementById("progressFill");

let currentIdx = 0;
let userAnswers = new Array(questionList.length).fill(null);
const letterArr = ["A","B","C","D"];

// 更新进度条
function updateProgress(){
    const total = questionList.length;
    const curr = currentIdx + 1;
    progressNum.innerText = `${curr} / ${total}`;
    const pct = (curr / total) * 100;
    progressFill.style.width = pct + "%";
}

//渲染当前题目
function renderQuestion(){
    const q = questionList[currentIdx];
    updateProgress();
    qTitle.innerText = q.title;

    let html = "";
    q.options.forEach((opt,oIdx)=>{
        const isChecked = userAnswers[currentIdx] === oIdx;
        html += `
        <div class="opt-item ${isChecked?'active':''}" data-idx="${oIdx}">
            <div class="opt-letter">${letterArr[oIdx]}</div>
            <div class="opt-text">${opt.text}</div>
        </div>
        `
    })
    optionBox.innerHTML = html;

    //点击选项直接写入答案数组
    document.querySelectorAll('.opt-item').forEach(item=>{
        item.onclick = function(){
            const idx = Number(this.dataset.idx);
            userAnswers[currentIdx] = idx;
            renderQuestion();
        }
    })

    prevBtn.disabled = currentIdx <= 0;

    if(currentIdx >= questionList.length - 1){
        nextBtn.style.display = "none";
        submitBtn.style.display = "block";
    }else{
        nextBtn.style.display = "block";
        submitBtn.style.display = "none";
    }
}

//上一题
prevBtn.addEventListener('click',()=>{
    if(currentIdx>0){
        currentIdx -=1;
        renderQuestion();
    }
})

//下一题
nextBtn.addEventListener('click',()=>{
    if(userAnswers[currentIdx] === null){
        alert("请选择一个选项再继续");
        return;
    }
    currentIdx += 1;
    renderQuestion();
})

//提交测评
submitBtn.addEventListener('click',()=>{
    // 在浏览器控制台打印全部答题数据，方便排查丢题
    console.log("全部答题数组：", userAnswers);

    //校验所有题目
    for(let i=0;i<userAnswers.length;i++){
        if(userAnswers[i] === null){
            alert(`第${i+1}题尚未作答，请完成！`);
            currentIdx = i;
            renderQuestion();
            return;
        }
    }
    const userVec = getUserVector(userAnswers, questionList);
    const matchResult = matchPerson(userVec, characterList);

    document.getElementById("resName").innerText = matchResult.name
    document.getElementById("resPortrait").innerText = matchResult.portrait
    document.getElementById("resAbility").innerHTML = matchResult.ability.map(item=>`<li>${item}</li>`).join("")
    document.getElementById("resRealShow").innerText = matchResult.realShow
    document.getElementById("resRisk").innerText = matchResult.risk
    document.getElementById("resSuggest").innerText = matchResult.suggest
    document.getElementById("resSimilar").innerText = matchResult.similarPool.join("、")

    quizPage.classList.remove("active");
    resultPage.classList.add("active");
})

// 重新答题
resetBtn.addEventListener('click', ()=>{
    currentIdx = 0;
    userAnswers = new Array(questionList.length).fill(null);
    quizPage.classList.add("active");
    resultPage.classList.remove("active");
    renderQuestion();
})

//初始化
renderQuestion();
</script>
</body>
</html>
